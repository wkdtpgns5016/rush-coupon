workflow:
  rules:
    - changes:
        - backend/**/*
        - frontend/**/*
        - .gitlab-ci.yml

stages:
  - lint
  - test
  - build
  - deploy

.backend_node_job:
  image: node:24-alpine
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd backend
    - npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

.frontend_node_job:
  image: node:24-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  before_script:
    - cd frontend
    - npm ci --cache "$CI_PROJECT_DIR/frontend/.npm" --prefer-offline
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml

backend-lint:
  extends: .backend_node_job
  stage: lint
  script:
    - npm run lint

backend-test:
  extends: .backend_node_job
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: rush_coupon
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    TEST_DB_HOST: postgres
    TEST_DB_PORT: "5432"
  before_script:
    - !reference [.backend_node_job, before_script]
    - apk add --no-cache postgresql-client
    - until pg_isready -h postgres -U "$POSTGRES_USER"; do sleep 1; done
    - psql "postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB" -f db/schema.sql
  script:
    - npm run test

backend-build:
  stage: build
  image: docker:24-cli
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx build --platform linux/amd64 -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" --push backend/

backend-deploy:
  stage: deploy
  image:
    name: alpine/git:latest
    entrypoint: [""]
  when: manual
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
  script:
    - apk add --no-cache postgresql-client
    - PGPASSWORD="$EXTERNAL_DB_PASSWORD" psql -h "$EXTERNAL_DB_HOST" -p "$EXTERNAL_DB_PORT" -U "$EXTERNAL_DB_USER" -d "$EXTERNAL_DB_NAME" -f backend/db/schema.sql
    - git clone --branch deploy --single-branch "https://${GITHUB_PAT}@github.com/wkdtpgns5016/rush-coupon.git" deploy-repo
    - cd deploy-repo
    - sed -i "s|^IMAGE=.*|IMAGE=$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA|" k8s/backend/overlays/local/image.env
    - git config user.email "ci@gitlab.local"
    - git config user.name "GitLab CI"
    - >
      git diff --quiet && echo "이미지 태그 변경 없음, 스킵" ||
      (git commit -am "deploy: backend image tag -> $CI_COMMIT_SHORT_SHA" && git push origin deploy)

frontend-lint:
  extends: .frontend_node_job
  stage: lint
  script:
    - npm run lint

frontend-build:
  extends: .frontend_node_job
  stage: build
  # VITE_API_BASE_URL은 frontend/.env.production에 커밋하지 않고,
  # GitLab CI/CD 변수(Settings > CI/CD > Variables)로 주입한다.
  # Vite는 기존 환경변수를 .env 파일보다 우선하므로 별도 파일 조작 없이 적용된다.
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour

frontend-deploy:
  stage: deploy
  image: alpine:latest
  when: manual
  needs:
    - frontend-build
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$FRONTEND_SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -p "$FRONTEND_SSH_PORT" -H "$FRONTEND_HOST" >> ~/.ssh/known_hosts
  script:
    # 같은 커밋을 재배포해도 디렉터리가 겹치지 않도록 job id를 붙인다 (기존 디렉터리에 scp -r 하면 dist/가 한 겹 중첩됨)
    - RELEASE_DIR="dist-$CI_COMMIT_SHORT_SHA-$CI_JOB_ID"
    - scp -P "$FRONTEND_SSH_PORT" -r frontend/dist "deploy@$FRONTEND_HOST:/releases/$RELEASE_DIR"
    - ssh -p "$FRONTEND_SSH_PORT" "deploy@$FRONTEND_HOST" "ln -sfn $RELEASE_DIR /releases/current"
