workflow:
  rules:
    - changes:
        - backend/**/*
        - frontend/**/*
        - .gitlab-ci.yml

stages:
  - lint
  - test
  - build
  - deploy

.backend_node_job:
  image: node:24-alpine
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd backend
    - npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

.frontend_node_job:
  image: node:24-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  before_script:
    - cd frontend
    - npm ci --cache "$CI_PROJECT_DIR/frontend/.npm" --prefer-offline
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml

backend-lint:
  extends: .backend_node_job
  stage: lint
  script:
    - npm run lint

backend-test:
  extends: .backend_node_job
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: valkey/valkey:8-alpine
      alias: valkey
    - name: rabbitmq:4-alpine
      alias: rabbitmq
  variables:
    POSTGRES_DB: rush_coupon
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    TEST_DB_HOST: postgres
    TEST_DB_PORT: "5432"
    TEST_VALKEY_HOST: valkey
    TEST_VALKEY_PORT: "6379"
    RABBITMQ_DEFAULT_USER: rush
    RABBITMQ_DEFAULT_PASS: rush
    TEST_RABBITMQ_HOST: rabbitmq
    TEST_RABBITMQ_PORT: "5672"
    TEST_RABBITMQ_USERNAME: rush
    TEST_RABBITMQ_PASSWORD: rush
  before_script:
    - !reference [.backend_node_job, before_script]
    - apk add --no-cache postgresql-client
    - until pg_isready -h postgres -U "$POSTGRES_USER"; do sleep 1; done
    # RabbitMQ(Erlang VM)는 postgres/valkey보다 기동이 느려서 명시적으로 포트가 열릴 때까지 기다린다.
    - until nc -z rabbitmq 5672; do sleep 1; done
    - psql "postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB" -f db/schema.sql
  script:
    - npm run test

backend-build:
  stage: build
  image: docker:24-cli
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # ECR_REPOSITORY_URL 형식: <account>.dkr.ecr.<region>.amazonaws.com/<repo>
    # Alpine의 aws-cli 패키지는 musl과 안 맞아 pyexpat relocation 에러로 깨짐
    # (aws ecr get-login-password 자체가 실행이 안 됨) — 대신 정적 바이너리인
    # amazon-ecr-credential-helper를 써서 같은 문제를 피한다. 인증은 이 EC2의
    # IAM 인스턴스 프로파일에서 자동으로 가져온다(정적 액세스키 없음).
    - apk add --no-cache curl jq
    - curl -fsSL -o /usr/local/bin/docker-credential-ecr-login
      https://amazon-ecr-credential-helper-releases.s3.us-east-2.amazonaws.com/0.12.0/linux-amd64/docker-credential-ecr-login
    - chmod +x /usr/local/bin/docker-credential-ecr-login
    - jq --arg host "${ECR_REPOSITORY_URL%%/*}" '.credHelpers[$host] = "ecr-login"'
      "$HOME/.docker/config.json" > /tmp/docker-config.json && mv /tmp/docker-config.json "$HOME/.docker/config.json"
    - >
      docker buildx build --platform linux/amd64
      -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
      -t "$ECR_REPOSITORY_URL:$CI_COMMIT_SHORT_SHA"
      --push backend/

backend-deploy:
  stage: deploy
  image:
    name: alpine/git:latest
    entrypoint: [""]
  when: manual
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
  script:
    - apk add --no-cache postgresql-client
    - PGPASSWORD="$EXTERNAL_DB_PASSWORD" psql -h "$EXTERNAL_DB_HOST" -p "$EXTERNAL_DB_PORT" -U "$EXTERNAL_DB_USER" -d "$EXTERNAL_DB_NAME" -f backend/db/schema.sql
    - git clone --branch deploy --single-branch "https://${GITHUB_PAT}@github.com/wkdtpgns5016/rush-coupon.git" deploy-repo
    - cd deploy-repo
    - sed -i "s|^IMAGE=.*|IMAGE=$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA|" k8s/backend/overlays/local/image.env
    - git config user.email "ci@gitlab.local"
    - git config user.name "GitLab CI"
    - >
      git diff --quiet && echo "이미지 태그 변경 없음, 스킵" ||
      (git commit -am "deploy: backend image tag -> $CI_COMMIT_SHORT_SHA" && git push origin deploy)

# backend-deploy와 달리 psql 스키마 적용 스텝이 없다 — RDS 보안그룹이 EKS 클러스터발
# 트래픽만 허용하는데(#55), 이 Runner EC2는 완전히 다른 VPC(#54)에 있어서 직접 못 붙는다.
# 스키마 적용은 클러스터 안에서(kubectl run 등으로) 일회성으로 처리한다.
backend-deploy-cloud:
  stage: deploy
  image:
    name: alpine/git:latest
    entrypoint: [""]
  when: manual
  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
  script:
    - git clone --branch deploy --single-branch "https://${GITHUB_PAT}@github.com/wkdtpgns5016/rush-coupon.git" deploy-repo
    - cd deploy-repo
    - sed -i "s|^IMAGE=.*|IMAGE=$ECR_REPOSITORY_URL:$CI_COMMIT_SHORT_SHA|" k8s/backend/overlays/cloud/image.env
    # RDS는 private subnet이라 이 Runner EC2(다른 VPC)가 직접 못 붙는다 — 그래서 psql로
    # 바로 적용하는 대신, 스키마 소스를 deploy 레포로 복사해 ArgoCD PreSync hook Job이
    # 클러스터 내부(EKS 노드, RDS와 같은 VPC)에서 적용하게 한다. schema.sql이 유일한
    # 소스(backend/db/schema.sql)라 여기 복사본은 매 배포마다 항상 최신으로 갱신된다.
    - cp ../backend/db/schema.sql k8s/backend/overlays/cloud/schema.sql
    - git config user.email "ci@gitlab.local"
    - git config user.name "GitLab CI"
    - >
      git diff --quiet && echo "변경 없음, 스킵" ||
      (git commit -am "deploy: cloud backend image tag -> $CI_COMMIT_SHORT_SHA" && git push origin deploy)

frontend-lint:
  extends: .frontend_node_job
  stage: lint
  script:
    - npm run lint

frontend-build:
  extends: .frontend_node_job
  stage: build
  # VITE_API_BASE_URL은 frontend/.env.production에 커밋하지 않고,
  # GitLab CI/CD 변수(Settings > CI/CD > Variables)로 주입한다.
  # Vite는 기존 환경변수를 .env 파일보다 우선하므로 별도 파일 조작 없이 적용된다.
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour

frontend-deploy:
  stage: deploy
  image: alpine:latest
  when: manual
  needs:
    - frontend-build
  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$FRONTEND_SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -p "$FRONTEND_SSH_PORT" -H "$FRONTEND_HOST" >> ~/.ssh/known_hosts
  script:
    # 같은 커밋을 재배포해도 디렉터리가 겹치지 않도록 job id를 붙인다 (기존 디렉터리에 scp -r 하면 dist/가 한 겹 중첩됨)
    - RELEASE_DIR="dist-$CI_COMMIT_SHORT_SHA-$CI_JOB_ID"
    - scp -P "$FRONTEND_SSH_PORT" -r frontend/dist "deploy@$FRONTEND_HOST:/releases/$RELEASE_DIR"
    - ssh -p "$FRONTEND_SSH_PORT" "deploy@$FRONTEND_HOST" "ln -sfn $RELEASE_DIR /releases/current"
