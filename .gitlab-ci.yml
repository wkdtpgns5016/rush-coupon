workflow:
  rules:
    - changes:
        - backend/**/*
        - frontend/**/*

stages:
  - lint
  - test
  - build
  - deploy

.backend_node_job:
  image: node:24-alpine
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd backend
    - npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline
  rules:
    - changes:
        - backend/**/*

.frontend_node_job:
  image: node:24-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  before_script:
    - cd frontend
    - npm ci --cache "$CI_PROJECT_DIR/frontend/.npm" --prefer-offline
  rules:
    - changes:
        - frontend/**/*

backend-lint:
  extends: .backend_node_job
  stage: lint
  script:
    - npm run lint

backend-test:
  extends: .backend_node_job
  stage: test
  script:
    - npm run test

backend-build:
  stage: build
  image: docker:24-cli
  rules:
    - changes:
        - backend/**/*
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx build --platform linux/amd64 -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" --push backend/

backend-deploy:
  stage: deploy
  image:
    name: alpine/git:latest
    entrypoint: [""]
  when: manual
  rules:
    - changes:
        - backend/**/*
  script:
    - git clone --branch deploy --single-branch "https://${GITHUB_PAT}@github.com/wkdtpgns5016/rush-coupon.git" deploy-repo
    - cd deploy-repo
    - sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$CI_COMMIT_SHORT_SHA/" k8s/backend/overlays/local/image-tag.properties
    - git config user.email "ci@gitlab.local"
    - git config user.name "GitLab CI"
    - >
      git diff --quiet && echo "이미지 태그 변경 없음, 스킵" ||
      (git commit -am "deploy: backend image tag -> $CI_COMMIT_SHORT_SHA" && git push origin deploy)

frontend-lint:
  extends: .frontend_node_job
  stage: lint
  script:
    - npm run lint

frontend-build:
  extends: .frontend_node_job
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour

frontend-deploy:
  stage: deploy
  image: alpine:latest
  when: manual
  needs:
    - frontend-build
  rules:
    - changes:
        - frontend/**/*
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$FRONTEND_SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H "$FRONTEND_HOST" >> ~/.ssh/known_hosts
  script:
    - RELEASE_DIR="dist-$CI_COMMIT_SHORT_SHA"
    - scp -r frontend/dist "$FRONTEND_SSH_USER@$FRONTEND_HOST:$FRONTEND_RELEASES_PATH/$RELEASE_DIR"
    - >
      ssh "$FRONTEND_SSH_USER@$FRONTEND_HOST"
      "ln -s $RELEASE_DIR $FRONTEND_RELEASES_PATH/current.new &&
       mv -Tf $FRONTEND_RELEASES_PATH/current.new $FRONTEND_RELEASES_PATH/current"
