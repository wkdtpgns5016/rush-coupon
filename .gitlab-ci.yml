workflow:
  rules:
    - changes:
        - backend/**/*

stages:
  - lint
  - test
  - build
  - deploy

.node_job:
  image: node:24-alpine
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - .npm/
  before_script:
    - cd backend
    - npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline

lint:
  extends: .node_job
  stage: lint
  script:
    - npm run lint

test:
  extends: .node_job
  stage: test
  script:
    - npm run test

build:
  stage: build
  image: docker:24-cli
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx build --platform linux/amd64 -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" --push backend/

deploy:
  stage: deploy
  image:
    name: alpine/git:latest
    entrypoint: [""]
  when: manual
  script:
    - git clone --branch deploy --single-branch "https://${GITHUB_PAT}@github.com/wkdtpgns5016/rush-coupon.git" deploy-repo
    - cd deploy-repo
    - sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$CI_COMMIT_SHORT_SHA/" k8s/backend/overlays/local/image-tag.properties
    - git config user.email "ci@gitlab.local"
    - git config user.name "GitLab CI"
    - >
      git diff --quiet && echo "이미지 태그 변경 없음, 스킵" ||
      (git commit -am "deploy: backend image tag -> $CI_COMMIT_SHORT_SHA" && git push origin deploy)
