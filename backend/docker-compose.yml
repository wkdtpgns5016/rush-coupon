services:
  postgres:
    image: postgres:16-alpine
    container_name: rush-coupon-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-rush_coupon}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_LOCAL_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-rush_coupon}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: rush-coupon-backend-local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-rush_coupon}
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  pgdata:
