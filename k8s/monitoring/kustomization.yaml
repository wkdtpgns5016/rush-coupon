apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Grafana 사이드카(kube-prometheus-stack)는 grafana_dashboard=1 라벨이 붙은 ConfigMap을 자동으로 읽는다.
# 이름/라벨/네임스페이스는 setup-k8s-vm의 setup-monitoring.sh가 만드는 대시보드 ConfigMap과 같은 규칙이다.
namespace: monitoring

configMapGenerator:
  - name: grafana-dashboard-rush-coupon-api
    files:
      - rush-coupon-api.json=dashboards/rush-coupon-api.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
