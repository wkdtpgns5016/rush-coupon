apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# valkey/rabbitmq가 base를 거치지 않고 여기서 직접 붙기 때문에, base의 namespace:
# 설정이 얘네한테는 안 먹는다 — 여기서도 명시해야 rush-coupon 네임스페이스로 들어간다.
namespace: rush-coupon

resources:
  - ../../base
  - ../../base/valkey
  - ../../base/rabbitmq

# base에는 imagePullSecrets가 없다 (cloud는 EKS 노드 IAM 역할로 ECR을 인증 없이 pull하므로
# 불필요) — 온프레미스는 GitLab 레지스트리 인증이 필요해서 여기서 다시 추가한다.
patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: gitlab-registry
  - target:
      kind: Deployment
      name: worker
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: gitlab-registry

configMapGenerator:
  - name: backend-image
    envs:
      - image.env
    options:
      disableNameSuffixHash: true

replacements:
  - source:
      kind: ConfigMap
      name: backend-image
      fieldPath: data.IMAGE
    targets:
      - select:
          kind: Deployment
          name: backend
        fieldPaths:
          - spec.template.spec.containers.0.image
      - select:
          kind: Deployment
          name: worker
        fieldPaths:
          - spec.template.spec.containers.0.image
