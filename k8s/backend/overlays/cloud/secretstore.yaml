# ESO의 AWS provider는 ParameterStore/SecretsManager를 한 SecretStore에서 같이 못 써서
# 둘로 나눈다. auth를 따로 안 적은 건, ESO 컨트롤러 자신의 ServiceAccount가 이미
# IRSA 역할(terraform/cloud-infra eso.tf)을 달고 있어서 — 그 신원을 그대로 상속한다.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-parameter-store
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-northeast-2
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
