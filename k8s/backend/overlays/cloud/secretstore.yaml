# auth를 따로 안 적은 건, ESO 컨트롤러 자신의 ServiceAccount가 이미 IRSA 역할
# (terraform/cloud-infra eso.tf)을 달고 있어서 — 그 신원을 그대로 상속한다.
#
# SecretsManager용 SecretStore는 여기 없다 — RDS Secrets Manager 비밀(DB_USERNAME/
# PASSWORD)은 더 이상 ESO/ExternalSecret으로 안 가져오고, db-credentials-job.yaml의
# Job이 자체 IAM 역할로 직접 조회해서 Secret을 채운다 (db-credentials-job.yaml 상단
# 주석 참고).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-parameter-store
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-northeast-2
