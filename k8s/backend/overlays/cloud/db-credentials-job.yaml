# backend-db-credentials(Secret)의 DB_USERNAME/DB_PASSWORD를 RDS Secrets Manager에서
# 가져와 채운다. 원래는 Terraform이 kubernetes_manifest로 ExternalSecret을 직접
# 만들었는데(RDS Secrets Manager ARN이 실제 리소스 식별자라 git에 못 올리는 값이라서),
# 두 가지 문제를 겪었다:
#   - plan 단계에서 실제 클러스터에 붙어야 해서, 클러스터를 처음부터 새로 만드는
#     apply 안에서는 "no client config"로 실패
#   - destroy 때 Terraform이 그 객체 삭제를 기다리는데, ESO 컨트롤러가 EKS 노드
#     그룹과 병렬로 먼저 사라지면 finalizer를 아무도 못 지워 멈춤
# 둘 다 "Terraform이 클러스터 안의 리소스를 직접 소유"해서 생긴 문제라, ArgoCD
# PreSync Hook Job(schema-apply와 같은 패턴)으로 옮겼다. ARN 자체는 git에 못 올리지만,
# "런타임에 RDS를 describe해서 ARN을 알아낸 뒤 그 값을 가져온다"는 로직은 코드로
# 커밋해도 안전하다 — IAM 정책(terraform/cloud-infra/db-credentials-job-iam.tf)이
# 이 역할을 그 ARN 하나로만 좁혀둔다.
# 이 ServiceAccount/Role/RoleBinding도 PreSync hook이어야 한다 — schema-apply/
# db-credentials-apply Job이 둘 다 PreSync인데, 이들을 hook으로 안 달면 일반 Sync
# 단계에서야 생겨서 Job보다 항상 늦다("serviceaccount not found"로 Job 생성 자체가
# 거부됨, 실제로 겪음 — schema-sql ConfigMap 때와 같은 종류의 실수).
# delete-policy는 안 넣는다 — Job처럼 "한 번 성공하면 끝"이 아니라 매 sync마다
# 반복해서 참조되는 리소스라 계속 남아있어야 한다.
#
# AWS 권한은 eks.amazonaws.com/role-arn 애노테이션(IRSA)이 아니라 EKS Pod Identity로
# 받는다 — terraform/cloud-infra/db-credentials-job-iam.tf의
# aws_eks_pod_identity_association이 "네임스페이스+이 ServiceAccount 이름"만으로
# AWS 쪽에서 미리 역할을 연결해둔다. 그래서 여기엔 애노테이션이 필요 없고, 계정 ID가
# 포함된 IAM 역할 ARN이 git에 전혀 안 남는다(이전엔 ARN을 여기 직접 적었음).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-credentials-job
  annotations:
    argocd.argoproj.io/hook: PreSync
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: db-credentials-job
  annotations:
    argocd.argoproj.io/hook: PreSync
rules:
  # create는 resourceNames로 못 좁힌다(아직 존재하지 않는 대상이라) — namespace
  # 범위 안에서만 허용되는 수준으로 타협한다.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["backend-db-credentials"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: db-credentials-job
  annotations:
    argocd.argoproj.io/hook: PreSync
subjects:
  - kind: ServiceAccount
    name: db-credentials-job
roleRef:
  kind: Role
  name: db-credentials-job
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-credentials-apply
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: db-credentials-job
      restartPolicy: Never
      containers:
        - name: db-credentials-apply
          image: amazon/aws-cli:2.17.62
          env:
            - name: DB_INSTANCE_ID
              value: rush-coupon-cloud-postgres
            - name: AWS_REGION
              value: ap-northeast-2
          command:
            - sh
            - -c
            - |
              set -e
              yum install -y -q jq curl >/dev/null
              curl -sL -o /usr/local/bin/kubectl \
                "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
              chmod +x /usr/local/bin/kubectl

              SECRET_ARN=$(aws rds describe-db-instances \
                --db-instance-identifier "$DB_INSTANCE_ID" \
                --query 'DBInstances[0].MasterUserSecret.SecretArn' --output text)
              SECRET_JSON=$(aws secretsmanager get-secret-value \
                --secret-id "$SECRET_ARN" --query SecretString --output text)
              DB_USERNAME=$(echo "$SECRET_JSON" | jq -r .username)
              DB_PASSWORD=$(echo "$SECRET_JSON" | jq -r .password)

              # backend-db-credentials-connection(ExternalSecret, DB_HOST/PORT/DATABASE/SSL)과
              # 같은 Secret에 키만 더 채운다 — kubectl apply의 3-way merge는 내가 이전에
              # 올린 적 없는 키(DB_HOST 등)를 지우지 않는다.
              kubectl create secret generic backend-db-credentials \
                --from-literal=DB_USERNAME="$DB_USERNAME" \
                --from-literal=DB_PASSWORD="$DB_PASSWORD" \
                --dry-run=client -o yaml | kubectl apply -f -
