# local-network의 ConfigMap/수동 Secret을 대체한다 — 값은 AWS에서 동기화되고,
# 파드가 참조하는 Secret 이름(backend-network/backend-db-credentials/rabbitmq-credentials)은
# 기존과 동일하게 유지한다 (#57 이슈 설명: "기존 kubectl create secret 기반 매니페스트
# 구조는 유지한 채 값만 AWS에서 동기화").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-network
spec:
  secretStoreRef:
    name: aws-parameter-store
    kind: SecretStore
  target:
    name: backend-network
  data:
    - secretKey: CORS_ORIGIN
      remoteRef:
        key: /rush-coupon-cloud/CORS_ORIGIN
    - secretKey: VALKEY_HOST
      remoteRef:
        key: /rush-coupon-cloud/VALKEY_HOST
    - secretKey: VALKEY_PORT
      remoteRef:
        key: /rush-coupon-cloud/VALKEY_PORT
    - secretKey: RABBITMQ_HOST
      remoteRef:
        key: /rush-coupon-cloud/RABBITMQ_HOST
    - secretKey: RABBITMQ_PORT
      remoteRef:
        key: /rush-coupon-cloud/RABBITMQ_PORT
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-credentials
spec:
  secretStoreRef:
    name: aws-parameter-store
    kind: SecretStore
  target:
    name: rabbitmq-credentials
  data:
    - secretKey: RABBITMQ_USERNAME
      remoteRef:
        key: /rush-coupon-cloud/RABBITMQ_USERNAME
    - secretKey: RABBITMQ_PASSWORD
      remoteRef:
        key: /rush-coupon-cloud/RABBITMQ_PASSWORD
---
# DB_HOST/PORT/DATABASE는 Parameter Store, USERNAME/PASSWORD는 RDS가 자동 관리하는
# Secrets Manager 비밀에서 — 한 ExternalSecret이 서로 다른 SecretStore를 동시에
# 참조할 수 없어서(dataFrom/data 항목별로는 가능하지만 이 리소스의 secretStoreRef는
# 하나뿐이다), USERNAME/PASSWORD는 별도 ExternalSecret으로 분리하고 같은 target Secret
# 이름으로 합친다. creationPolicy: Merge가 필수다 — 기본값(Owner)이면 먼저 적용된
# ExternalSecret만 그 Secret의 소유자가 되고 나머지는 SecretOwnedByOther로 거부된다
# (실제로 겪은 에러).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-db-credentials-connection
spec:
  secretStoreRef:
    name: aws-parameter-store
    kind: SecretStore
  target:
    name: backend-db-credentials
    creationPolicy: Merge
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: /rush-coupon-cloud/DB_HOST
    - secretKey: DB_PORT
      remoteRef:
        key: /rush-coupon-cloud/DB_PORT
    - secretKey: DB_DATABASE
      remoteRef:
        key: /rush-coupon-cloud/DB_DATABASE
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-db-credentials-auth
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: backend-db-credentials
    creationPolicy: Merge
  data:
    # RDS_SECRET_ARN_PLACEHOLDER는 overlays/cloud/kustomization.yaml의 replacements가
    # db-secret.env(gitignored, 실제 ARN)의 값으로 치환한다 — image.env/IMAGE_PLACEHOLDER와
    # 동일한 패턴. ARN엔 계정ID가 들어있어서 .example이 아닌 이 파일엔 절대 실제 값을 안 쓴다.
    - secretKey: DB_USERNAME
      remoteRef:
        key: RDS_SECRET_ARN_PLACEHOLDER
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: RDS_SECRET_ARN_PLACEHOLDER
        property: password
