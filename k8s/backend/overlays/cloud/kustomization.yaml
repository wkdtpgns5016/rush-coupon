apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# overlays/local과 달리 valkey/rabbitmq는 포함하지 않는다 — ElastiCache/Amazon MQ로
# 완전히 대체 (base에도 애초에 없음, local만 명시적으로 추가하는 구조).
# imagePullSecrets 패치도 없다 — EKS 노드 IAM 역할로 ECR을 인증 없이 pull하므로 불필요.
#
# secretstore.yaml/external-secrets.yaml/ingress.yaml은 base를 거치지 않는 sibling
# 리소스라 base의 namespace: rush-coupon이 안 먹는다 (overlays/local에서 valkey/rabbitmq
# 때 겪은 것과 같은 함정) — 그래서 여기서 namespace를 명시한다.
#
# backend-db-credentials-auth(RDS Secrets Manager ARN 참조)는 여기 없다 — ARN이 실제
# 리소스 식별자라 git에 못 올려서, terraform/cloud-infra/eso-db-credentials.tf가 직접
# 생성한다 (external-secrets.yaml 상단 주석 참고).
namespace: rush-coupon

resources:
  - ../../base
  - secretstore.yaml
  - external-secrets.yaml
  - ingress.yaml
  - schema-apply-job.yaml

# postgres-exporter의 DATA_SOURCE_URI는 base에서 sslmode=disable로 고정돼있다(온프레미스
# 기본값, 건드리면 위험한 이유는 postgres-exporter/deployment.yaml 주석 참고) — RDS는 SSL을
# 강제해서 여기서만 require로 덮어쓴다. env 배열의 인덱스 3번이 DATA_SOURCE_URI다
# (DB_HOST=0, DB_PORT=1, DB_DATABASE=2, DATA_SOURCE_URI=3 — base 파일의 env 순서 그대로).
patches:
  - target:
      kind: Deployment
      name: postgres-exporter
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "$(DB_HOST):$(DB_PORT)/$(DB_DATABASE)?sslmode=require"

configMapGenerator:
  - name: backend-image
    envs:
      - image.env
    options:
      disableNameSuffixHash: true
  # backend-image와 달리 해시 접미사를 그대로 둔다 — schema.sql 내용이 바뀌면 ConfigMap
  # 이름도 바뀌어서(schema-apply-job.yaml의 volumes.configMap.name 참조는 kustomize가
  # 자동으로 새 이름에 맞게 고쳐준다) 매 sync마다 정확히 그 시점의 스키마가 적용된다.
  #
  # annotations로 이 ConfigMap도 PreSync hook으로 지정한다 — 안 하면 일반 리소스라
  # Sync 단계에서야 생성되는데, schema-apply Job은 그보다 앞선 PreSync 단계에서 이미
  # 떠서 "configmap not found"로 마운트가 깨진다(실제로 겪은 에러). 같은 PreSync 단계에
  # 두면 Job과 함께 먼저 생성된다.
  - name: schema-sql
    files:
      - schema.sql
    options:
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: HookSucceeded

replacements:
  - source:
      kind: ConfigMap
      name: backend-image
      fieldPath: data.IMAGE
    targets:
      - select:
          kind: Deployment
          name: backend
        fieldPaths:
          - spec.template.spec.containers.0.image
      - select:
          kind: Deployment
          name: worker
        fieldPaths:
          - spec.template.spec.containers.0.image
