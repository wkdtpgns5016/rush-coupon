apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  labels:
    # setup-k8s-vm은 모든 ServiceMonitor를 선택하도록 설치하지만, 기본 selector로 재설치해도 잡히도록 남겨둔다.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /metrics
      # 스택 기본 scrape 주기(60s)보다 촘촘하게 — 부하 테스트 중 RPS/지연 변화를 보기 위함
      interval: 15s
      scrapeTimeout: 10s
