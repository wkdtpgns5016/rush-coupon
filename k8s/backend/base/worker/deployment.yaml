apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  # 큐 길이 기반 오토스케일링은 KEDA 같은 추가 인프라(+ RabbitMQ management API)가 필요해서
  # 이번 범위에서는 보류하고 고정 2대로 시작한다. RabbitMQ의 competing-consumers 패턴 덕분에
  # 여러 Pod가 같은 큐를 자연스럽게 나눠 처리한다.
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      # imagePullSecrets는 여기 없다 — local 오버레이가 패치로 추가한다 (backend/deployment.yaml 참고)
      containers:
        - name: worker
          image: IMAGE_PLACEHOLDER
          # backend와 같은 이미지를 쓰되 엔트리포인트만 배치 컨슈머로 바꾼다.
          command: ["node", "dist/worker.main.js"]
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-db-credentials
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: backend-db-credentials
                  key: DB_PORT
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: backend-db-credentials
                  key: DB_DATABASE
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-db-credentials
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-db-credentials
                  key: DB_PASSWORD
            # app.module.ts/base/deployment.yaml과 동일한 이유(RDS rds.force_ssl=1) — optional이라
            # 온프레미스(이 키 없음)는 안 깨지고 worker.module.ts 기본값(false)이 적용된다.
            - name: DB_SSL
              valueFrom:
                secretKeyRef:
                  name: backend-db-credentials
                  key: DB_SSL
                  optional: true
            - name: RABBITMQ_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-network
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                secretKeyRef:
                  name: backend-network
                  key: RABBITMQ_PORT
            - name: RABBITMQ_PROTOCOL
              valueFrom:
                secretKeyRef:
                  name: backend-network
                  key: RABBITMQ_PROTOCOL
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
