apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend
  namespace: argocd
spec:
  # 적용 전에 install-eso.sh/install-alb-controller.sh/install-monitoring.sh/
  # install-metrics-server.sh가 전부 끝나 있어야 한다 — 그렇지 않으면 ExternalSecret/
  # Ingress/ServiceMonitor가 각자의 CRD/컨트롤러 부재로 동기화 실패를 반복한다
  # (이전엔 SkipDryRunOnMissingResource로 우회했었는데, 설치 순서를 지키면 애초에
  # 필요 없는 우회라 제거했다).
  project: default
  source:
    repoURL: https://github.com/wkdtpgns5016/rush-coupon.git
    targetRevision: deploy
    path: k8s/backend/overlays/cloud
  destination:
    server: https://kubernetes.default.svc
    namespace: rush-coupon
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # rush-coupon 네임스페이스가 미리 존재한다고 가정하면 안 된다 — 완전히 빈 환경에서
    # 처음 apply할 때는 이 네임스페이스 자체가 없어서 "namespaces not found"로 sync가
    # 계속 실패한다(실제로 겪음, 그동안은 예전 환경에 남아있던 네임스페이스를 계속
    # 재사용해서 몰랐던 문제). ArgoCD가 destination 네임스페이스를 직접 만들게 한다.
    syncOptions:
      - CreateNamespace=true
