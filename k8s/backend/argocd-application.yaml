apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wkdtpgns5016/rush-coupon.git
    targetRevision: deploy
    path: k8s/backend/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: rush-coupon
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
