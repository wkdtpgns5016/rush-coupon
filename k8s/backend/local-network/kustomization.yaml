apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rush-coupon

resources:
  - ingress.yaml

configMapGenerator:
  - name: backend-network
    envs:
      - network-connection.env
    options:
      disableNameSuffixHash: true

replacements:
  - source:
      kind: ConfigMap
      name: backend-network
      fieldPath: data.INGRESS_HOST
    targets:
      - select:
          kind: Ingress
          name: backend
        fieldPaths:
          - spec.rules.0.host
