services:
  postgres:
    image: postgres:16-alpine
    container_name: rush-coupon-postgres
    restart: unless-stopped
    ports:
      - "0.0.0.0:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./init/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../../backend/db/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ../../backend/db/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
