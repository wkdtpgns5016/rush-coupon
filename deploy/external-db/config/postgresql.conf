# 네트워크
listen_addresses = '*'
port = 5432

# 리소스 & 동시 커넥션 설정 (k6 부하 테스트 대비 상향)
max_connections = 300
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 16MB
maintenance_work_mem = 128MB

# WAL & 체크포인트 (디스크 I/O 병목 완화)
checkpoint_completion_target = 0.9
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB

# 로깅 (성능 분석용 - 100ms 초과 슬로우 쿼리 기록)
log_destination = 'stderr'
logging_collector = on
log_min_duration_statement = 100
