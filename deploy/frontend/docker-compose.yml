services:
  nginx:
    build: .
    container_name: rush-coupon-frontend
    restart: unless-stopped
    environment:
      DEPLOY_PUBLIC_KEY: ${DEPLOY_PUBLIC_KEY}
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-8080}:80"
      - "0.0.0.0:${FRONTEND_SSH_PORT:-2222}:22"
    volumes:
      - frontend_releases:/releases

volumes:
  frontend_releases:
